# XcodeGen definition for Cassowary.
#
# Cassowary is an independent, unaffiliated iOS app. It is not part of
# OpenEmu and is not endorsed by the OpenEmu Team. It runs OpenEmu's emulator
# cores and shared frameworks as its engine: rather than converting the
# large macOS AppKit project, Cassowary is defined here as a new target that
# reuses the same frameworks and plugins.
#
# Regenerate with:
#   xcodegen generate --spec Cassowary/project.yml --project Cassowary
#
# The app's Swift sources live under Cassowary/Sources. Everything else
# it needs comes from the SDK and OpenEmuKit.
#
# Bundle ID note: org.cassowary.Cassowary. Change PRODUCT_BUNDLE_IDENTIFIER
# below (and BUNDLE_ID in Scripts/cassowary/*.sh) to move it.

name: Cassowary

options:
  bundleIdPrefix: org.cassowary
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Left to a post-build step: Xcode insists on a development team for
    # Catalyst, and an ad-hoc signature is all a local build needs. See the
    # signing step in Scripts/cassowary/build-cassowary.sh.
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Cassowary-Bridging-Header.h
    # OpenEmuKit's private module map lives in its source tree, not in the
    # built framework, so Swift needs this search path to resolve it.
    SWIFT_INCLUDE_PATHS:
      - "$(SRCROOT)/../OpenEmuKit/Source"

targets:
  Cassowary:
    type: application
    platform: iOS
    # iPadOS builds from the same iOS SDK and ships as the same binary, so
    # there is no second target: iPad is a supported destination of this one.
    # Listing it here is what ticks iPad in the project's Supported
    # Destinations; Mac
    # Catalyst is declared separately with SUPPORTS_MACCATALYST.
    supportedDestinations: [iOS, iPadOS]
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        # The Apple TV app has its own @main and tvOS-only views. They live
        # under Sources/TV and are compiled by the CassowaryTV target instead.
        excludes:
          - TV
      # Info.plist is picked up through INFOPLIST_FILE; listing the directory
      # would also copy it as a resource, which conflicts. Shaders are excluded
      # here and added as a folder reference below, because the bundle has to
      # keep the Shaders/<name>/<name>.slangp layout OEShaderStore reads; a flat
      # resource copy would lose it.
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - Info-tvOS.plist
          - "*.entitlements"
          - Shaders
          - TV
      # The video filters, copied as one folder so the tree survives.
      - path: Resources/Shaders
        type: folder
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cassowary.Cassowary
        PRODUCT_NAME: Cassowary
        INFOPLIST_FILE: Resources/Info.plist
        # Mac Catalyst builds the same app for the Mac. The destination picks
        # it; this only declares that the target can be built that way.
        SUPPORTS_MACCATALYST: "YES"
        # Signing is off for local builds, so entitlements have to be asked for
        # explicitly or the app runs unsandboxed and reads the user's real
        # Documents folder instead of its own container.
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
        # The app embeds the cores and system plugins it can load.
        # A flat iOS bundle puts frameworks and PlugIns beside the executable.
        # A Mac Catalyst bundle nests them under Contents/, so the loader has
        # to go up one level. Both sets are listed; the extra ones are inert.
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
          - "@executable_path/PlugIns/Cores"
          - "@executable_path/PlugIns/Systems"
          - "@executable_path/../Frameworks"
          - "@executable_path/../PlugIns/Cores"
          - "@executable_path/../PlugIns/Systems"
        # Where the cores and system plugins are copied from.
        PLUGINS_SOURCE_DIR: "$(SRCROOT)/../build/cassowary-plugins"
    postCompileScripts:
      # Plugin bundles have to be copied as bundles, not flattened into the
      # resources directory, which is what a plain resource entry would do.
      - name: Copy PlugIns
        script: |
          "${SRCROOT}/../Scripts/cassowary/stage-plugins.sh" "${SRCROOT}/PlugIns"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/PlugIns/.plugins-copied
    # XcodeGen writes this file from the properties below, so the contents live
    # here rather than in the file itself. Mac Catalyst apps are sandboxed,
    # which gives the app its own Documents folder under ~/Library/Containers;
    # without it the app would scan the user's real ~/Documents.
    #
    # A real-device build passes CODE_SIGN_ENTITLEMENTS= on the xcodebuild
    # command line: the keys below are macOS-only and iOS signing rejects them.
    # See the --device signing step in Scripts/cassowary/build-cassowary.sh.
    entitlements:
      path: Resources/Cassowary.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # A sandboxed Mac app may not open a network connection without this.
        # The iOS side needs no such key, so its absence went unnoticed until
        # cover art downloads started failing on the Mac with "Check your
        # connection." — the sandbox refused every request before it left.
        com.apple.security.network.client: true
        # The Mupen64Plus N64 core runs a JIT (MAP_JIT) for its CPU emulation.
        com.apple.security.cs.allow-jit: true
        # Cores and their helper dylibs are ad-hoc signed in local builds, and
        # library validation would refuse to load them.
        com.apple.security.cs.disable-library-validation: true
    dependencies:
      # The frameworks are built for iOS by Scripts/cassowary/build-cassowary.sh
      # before this project is generated, then linked from the shared build
      # directory. codeSign is on so a signed device build re-signs them with
      # the app's identity on copy; unsigned Simulator and Catalyst builds
      # skip signing entirely.
      - framework: Frameworks/OpenEmuBase.framework
        embed: true
        codeSign: true
      - framework: Frameworks/OpenEmuSystem.framework
        embed: true
        codeSign: true
      - framework: Frameworks/OpenEmuShaders.framework
        embed: true
        codeSign: true
      - framework: Frameworks/OpenEmuKit.framework
        embed: true
        codeSign: true

  # The Apple TV app. It shares the engine-facing sources with the phone app
  # and adds its own UI under Sources/TV. Games and saves are pulled from a
  # phone later; for now it plays the demo game in the bundle, which proves
  # the engine runs on tvOS.
  #
  # Shared code lives in Sources/Shared/ and is compiled into both apps, so a
  # new shared file needs no spec change. The per-file list below is only for
  # files outside Shared/ that the TV needs: prefer adding to Shared/ over
  # extending it, or the next feature lags the phone again.
  #
  # Its frameworks and plugins are staged into Frameworks-tvOS/ and
  # PlugIns-tvOS/ by Scripts/cassowary/build-cassowary.sh --tvos-sim, so a TV
  # build never overwrites the phone's copies (and the other way around).
  CassowaryTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      # The game session and the Metal layer host: the same files the phone
      # runs, plus the input and layout code the session needs.
      - path: Sources/TV
      - path: Sources/Session
      # Shared models and views, compiled into both apps: same presets, same
      # per-system memory, same credits, same artwork paths.
      - path: Sources/Shared
      # The installed systems and cores, and the per-system defaults: the
      # library's icons, the Play With… picker, and the settings screens.
      - path: Sources/Models/CoreCatalog.swift
      # The video filter list, shared with the phone: same presets, same
      # per-system memory. It only needs Foundation and OpenEmuKit.
      - path: Sources/Models/ShaderCatalog.swift
      # The session reads the RetroAchievements login and keeps its live
      # state. The TV has no sign-in screen, so it always plays signed out.
      - path: Sources/Models/RetroAchievementsStore.swift
      - path: Sources/Models/RetroAchievementsSessionState.swift
      - path: Sources/Models/ScreenScraperCredentials.swift
      # The upscaling switches, the same shape as the video filter.
      - path: Sources/Models/UpscalingOptions.swift
      - path: Sources/Views/GameLayerView.swift
      - path: Sources/Controls/ControllerLayout.swift
      - path: Sources/Controls/InputBindings.swift
      # Remapping a controller's buttons: the same screen and capture code as
      # the phone, so a remap works the same way on both.
      - path: Sources/Controls/InputMonitors.swift
      - path: Sources/Views/ControllerBindingsView.swift
      - path: Sources/Controls/KeyboardKey.swift
      - path: Sources/Controls/RumbleHaptics.swift
      # The transfer layer. The server and the host-side index are the
      # phone's half of it, so they are not listed here.
      - path: Sources/Transfer/TransferProtocol.swift
      - path: Sources/Transfer/DeviceIdentity.swift
      - path: Sources/Transfer/GameIdentity.swift
      - path: Sources/Transfer/SaveStore.swift
      - path: Sources/Transfer/SaveSync.swift
      - path: Sources/Transfer/MediaClient.swift
      - path: Sources/Transfer/PeerBrowser.swift
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - Info-tvOS.plist
          - "*.entitlements"
          - Shaders
          - TV
      # The demo game, copied to the bundle root so Bundle.main finds it.
      - path: Resources/TV
        buildPhase: resources
        excludes:
          - "*.md"
      # The video filters, copied as one folder so the tree survives.
      # Same entry as the phone target: OEShaderStore reads the
      # Shaders/<name>/<name>.slangp layout from the main bundle.
      - path: Resources/Shaders
        type: folder
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cassowary.CassowaryTV
        PRODUCT_NAME: Cassowary
        INFOPLIST_FILE: Resources/Info-tvOS.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
          - "@executable_path/PlugIns/Cores"
          - "@executable_path/PlugIns/Systems"
    postCompileScripts:
      - name: Copy PlugIns
        script: |
          "${SRCROOT}/../Scripts/cassowary/stage-plugins.sh" "${SRCROOT}/PlugIns-tvOS"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/PlugIns/.plugins-copied
    dependencies:
      # Built for tvOS by Scripts/cassowary/build-cassowary.sh, then linked
      # from the TV staging directory.
      - framework: Frameworks-tvOS/OpenEmuBase.framework
        embed: true
        codeSign: true
      - framework: Frameworks-tvOS/OpenEmuSystem.framework
        embed: true
        codeSign: true
      - framework: Frameworks-tvOS/OpenEmuShaders.framework
        embed: true
        codeSign: true
      - framework: Frameworks-tvOS/OpenEmuKit.framework
        embed: true
        codeSign: true
