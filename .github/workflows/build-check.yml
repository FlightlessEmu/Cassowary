name: Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-sources:
    # Fast guard (no Xcode): catches a flattened core that was committed
    # without its vendored upstream source — the regression that silently
    # broke the Dolphin build for months because CI never compiled it.
    # Runs on every PR; it takes seconds and needs no build toolchain.
    name: Core sources present
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Check vendored core externals are populated
        run: ./Scripts/check-core-sources.sh

      - name: Check upstream inventory and update preservation
        run: |
          python3 Scripts/upstream/core-upstream.py check
          python3 -m unittest discover -s Scripts/upstream/tests -v

  sdk-tests:
    name: OpenEmuBase tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Run OpenEmuBaseTests (incl. RA hardcore regression suite)
        run: |
          xcodebuild test \
            -project OpenEmu-SDK/OpenEmu-SDK.xcodeproj \
            -scheme OpenEmuBase \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  detect-core-changes:
    name: Detect changed cores
    runs-on: ubuntu-latest
    outputs:
      cores: ${{ steps.detect.outputs.cores }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      - name: Determine which cores to build
        id: detect
        run: |
          # The app and CI read the same inventory.
          all_cores=$(python3 Scripts/upstream/core-upstream.py shipped)

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # Manual workflow_dispatch run has no PR base to diff against — build everything.
            echo "No previous revision to compare — building all cores"
            cores="$all_cores"
          else
            # Read filenames through stdin: large upstream imports can exceed
            # the system's environment-variable size limit.
            cores=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | python3 Scripts/upstream/core-upstream.py changed)
          fi

          echo "Cores to build: $cores"
          echo "cores=$cores" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

  build-cores:
    name: Build core (${{ matrix.core }})
    needs: detect-core-changes
    if: needs.detect-core-changes.outputs.cores != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJson(needs.detect-core-changes.outputs.cores) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Clear SPM binary artifact cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/

      - name: Build ${{ matrix.core }} for the iOS Simulator
        run: ./Scripts/cassowary/build-core-ios.sh "${{ matrix.core }}" --quiet
