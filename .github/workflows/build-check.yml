name: Build Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  core-sources:
    # Fast guard (no Xcode): catches a flattened core that was committed
    # without its vendored upstream source — the regression that silently
    # broke the Dolphin build for months because CI never compiled it.
    # Runs on every PR; it takes seconds and needs no build toolchain.
    name: Core sources present
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Check vendored core externals are populated
        run: ./Scripts/check-core-sources.sh

  sdk-tests:
    name: OpenEmuBase tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Run OpenEmuBaseTests (incl. RA hardcore regression suite)
        run: |
          xcodebuild test \
            -project OpenEmu-SDK/OpenEmu-SDK.xcodeproj \
            -scheme OpenEmuBase \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  detect-core-changes:
    name: Detect changed cores
    runs-on: ubuntu-latest
    outputs:
      cores: ${{ steps.detect.outputs.cores }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      - name: Determine which cores to build
        id: detect
        run: |
          # Only these cores have been ported to iOS; the rest need OpenGL or
          # their own platform work. Keep this list in step with the CORES
          # array in Scripts/cassowary/build-cassowary.sh.
          all_cores='["4DO","Atari800","Bliss","blueMSX","BSNES","CrabEmu","FCEU","Gambatte","GenesisPlus","JollyCV","MAME","Mednafen","mGBA","Nestopia","O2EM","picodrive","PokeMini","Potator-Core","ProSystem","SNES9x","Stella","VirtualJaguar"]'

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Manual workflow_dispatch run has no PR base to diff against — build everything.
            echo "Not a pull_request event — building all cores"
            cores="$all_cores"
          else
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
            echo "Changed files:"
            echo "$changed"

            # A change to shared framework code, the workspace, or the build
            # scripts can affect every core's build — fall back to all of them.
            # OpenEmuKit/ is included because several cores compile .m files
            # directly out of OpenEmuKit/Source/ into their own plugin targets.
            if echo "$changed" | grep -qE '^(OpenEmu-SDK/|OpenEmu-metal\.xcworkspace/|OpenEmuKit/|OpenEmu-Shaders/|Scripts/cassowary/)'; then
              echo "Shared code changed — building all cores"
              cores="$all_cores"
            else
              cores=$(CHANGED_FILES="$changed" ALL_CORES="$all_cores" python3 -c "
          import json, os
          all_cores = json.loads(os.environ['ALL_CORES'])
          changed = os.environ['CHANGED_FILES'].splitlines()
          selected = [c for c in all_cores if any(f.startswith('cores/' + c + '/') for f in changed)]
          print(json.dumps(selected))
          ")
            fi
          fi

          echo "Cores to build: $cores"
          echo "cores=$cores" >> "$GITHUB_OUTPUT"

  build-cores:
    name: Build core (${{ matrix.core }})
    needs: detect-core-changes
    if: needs.detect-core-changes.outputs.cores != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJson(needs.detect-core-changes.outputs.cores) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Clear SPM binary artifact cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/

      - name: Build ${{ matrix.core }} for the iOS Simulator
        run: ./Scripts/cassowary/build-core-ios.sh "${{ matrix.core }}" --quiet
